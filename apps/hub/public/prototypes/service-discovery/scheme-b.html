<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Schemes &amp; Services — Option B, Filter Panel and Table</title>
<link rel="stylesheet" href="core.css">
<style>
.layout{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start}
.filters{border:1px solid var(--sa-hair);border-radius:var(--sa-radius-lg);padding:16px;background:var(--sa-white);position:sticky;top:16px}
.fgroup{margin-bottom:16px}
.fgroup h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--sa-muted);margin:0 0 8px;font-weight:700}
.fopt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .12s;line-height:1.3}
.fopt:hover{background:var(--sa-surface)}
.fopt input{accent-color:var(--sa-primary-500);width:15px;height:15px;margin:0;flex:none}
.fopt.zero{opacity:.45}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--sa-white);border:1px solid var(--sa-hair);border-radius:var(--sa-radius-lg);overflow:hidden}
th{background:var(--sa-primary-50);color:var(--sa-primary-800);text-align:left;font-size:11px;letter-spacing:.7px;text-transform:uppercase;padding:10px 14px;font-weight:700}
td{padding:10px 14px;border-top:1px solid var(--sa-hair);vertical-align:top;line-height:1.4}
td a{color:var(--sa-primary-600);font-weight:600;text-decoration:none}
td small{display:block;color:var(--sa-muted);font-size:11.5px;margin-top:2px}
.applied{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;min-height:34px}
.empty{border:1px solid var(--sa-hair);border-radius:var(--sa-radius-lg);padding:26px;text-align:center;background:var(--sa-white)}
.pager{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.pager button{font:inherit;font-size:13px;min-width:34px;height:34px;border-radius:var(--sa-radius);border:1px solid var(--sa-hair);background:var(--sa-white);cursor:pointer}
.pager button[aria-current="page"]{background:var(--sa-primary-500);border-color:var(--sa-primary-500);color:var(--sa-white);font-weight:600}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<main class="wrap sec">
  <div>
    <h1 class="sec-t">Schemes &amp; Services</h1>
    <p class="sec-lede">Tick who the scheme is for and what it provides. Filters combine, so a group and a kind of support can be asked for together.</p>
  </div>
  <div class="layout">
    <aside class="filters" id="filters"></aside>
    <section>
      <div class="applied" id="applied"></div>
      <div id="table"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
  <p class="note">Listing is not a decision on any application — the sanctioning authority decides that.</p>
</main>
<script>
/* No masthead: this option is reviewed as the section alone.
   Two axes, the same as the home page. No count anywhere: a filter that would
   leave the table empty is greyed rather than numbered, and the table is paged
   at ten so the page keeps its height. */
const el = id => document.getElementById(id);
const PAGE = 10;
const sel = { who:new Set(), offer:new Set() };
const qs = new URLSearchParams(location.search);
if (qs.get('g')) sel.who.add(qs.get('g'));
if (qs.get('o')) sel.offer.add(qs.get('o'));
let page = 1;

const ok = (s, whoSet, offerSet) =>
  (!whoSet.size || [...whoSet].some(w => pairOk(s, w))) &&
  (!offerSet.size || [...offerSet].some(o => pairOk(s, undefined, o))) &&
  (!whoSet.size || !offerSet.size || [...whoSet].some(w => [...offerSet].some(o => pairOk(s, w, o))));
const rows = () => SCHEMES.filter(s => ok(s, sel.who, sel.offer));
/* Would ticking this value, with every OTHER selection as it stands, leave anything? */
function wouldLeave(axis, id){
  const w = axis==='who' ? new Set([id]) : sel.who;
  const o = axis==='offer' ? new Set([id]) : sel.offer;
  return SCHEMES.some(s => ok(s, w, o));
}
function drawFilters(){
  const block = (title, axis, items) => `
    <div class="fgroup"><h3>${title}</h3>
    ${items.map(x=>{const on=sel[axis].has(x.id), live=on||wouldLeave(axis,x.id);return `
      <label class="fopt ${live?'':'zero'}" ${live?'':'aria-disabled="true"'}>
        <input type="checkbox" data-axis="${axis}" data-id="${x.id}" ${on?'checked':''} ${live?'':'disabled'}>
        <span>${x.short||x.label}</span></label>`;}).join('')}
    </div>`;
  el('filters').innerHTML =
    block('Who It Is For','who',PERSONAS) + block('What It Provides','offer',OFFERINGS) +
    `<button class="btn ghost" id="reset" style="width:100%">Reset Filters</button>`;
  el('reset').onclick = () => { sel.who.clear(); sel.offer.clear(); page=1; draw(); };
}
function draw(){
  drawFilters();
  const list = rows();
  const chips = [...sel.who].map(g=>['who',g,GROUP_LABEL[g]]).concat([...sel.offer].map(o=>['offer',o,OFFER_LABEL[o]]));
  el('applied').innerHTML = chips.length
    ? `<span style="font-size:12.5px;color:var(--sa-muted)">Showing</span>` +
      chips.map(([a,i,l])=>`<button class="chip" aria-pressed="true" data-clear="${a}:${i}">${l} ×</button>`).join('')
    : `<span style="font-size:12.5px;color:var(--sa-muted)">Tick a filter to narrow the list.</span>`;
  const pages = Math.max(1, Math.ceil(list.length/PAGE));
  if (page>pages) page = pages;
  const slice = list.slice((page-1)*PAGE, page*PAGE);
  el('table').innerHTML = list.length ? `
    <table class="rise"><thead><tr>
      <th style="width:34%">Scheme</th><th style="width:34%">What It Provides</th><th>Whom It Names</th><th style="width:11%">Type</th></tr></thead>
      <tbody>${slice.map(s=>`<tr>
        <td><a href="#">${s.name}</a>${s.umbrella?`<small>${s.umbrella}</small>`:''}</td>
        <td>${s.provides}</td>
        <td>${s.named}</td>
        <td><span class="tag ${/Central|Sponsored/.test(s.type)?'blue':'grey'}">${s.type}</span></td></tr>`).join('')}
      </tbody></table>`
    : `<div class="empty rise"><b style="font-size:15px">No scheme matches those filters together.</b>
        <p style="font-size:13.5px;color:var(--sa-ink-muted);margin:8px 0 14px">A greyed filter is one that would leave nothing with the others as they stand. Removing one usually brings the list back.</p>
        <button class="btn" onclick="document.getElementById('reset').click()">Reset Filters</button></div>`;
  el('pager').innerHTML = pages>1 ? Array.from({length:pages},(_,i)=>`<button data-p="${i+1}" ${i+1===page?'aria-current="page"':''}>${i+1}</button>`).join('') : '';
}
document.addEventListener('change', e => {
  const c = e.target.closest('input[data-axis]'); if(!c) return;
  const s = sel[c.dataset.axis];
  c.checked ? s.add(c.dataset.id) : s.delete(c.dataset.id);
  page = 1; draw();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-clear]'); if(b){ const [a,i] = b.dataset.clear.split(':'); sel[a].delete(i); page=1; draw(); return; }
  const p = e.target.closest('button[data-p]'); if(p){ page=+p.dataset.p; draw(); }
});
draw();
</script></body></html>
