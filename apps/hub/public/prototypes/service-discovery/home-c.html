<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Find Schemes for You — Home Page, Option C</title>
<link rel="stylesheet" href="core.css">
<style>
.strip{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 20px}
.result{border:1px solid var(--sa-hair);border-radius:var(--sa-radius-lg);overflow:hidden;background:var(--sa-white)}
.rhead{padding:14px 20px;border-bottom:1px solid var(--sa-hair);display:flex;align-items:center;gap:14px;background:var(--sa-primary-50)}
.rhead .m{width:52px;height:52px;border-radius:50%;background:var(--sa-white);flex:none;overflow:hidden;display:grid;place-items:center}
.rhead .m img{width:100%;height:100%;object-fit:contain}
.rhead .m .mark-none{width:100%;height:100%;border-radius:50%}
.rhead b{font-size:16px;color:var(--sa-primary-800)}
.rhead p{margin:3px 0 0;font-size:13px;color:var(--sa-ink-muted)}
.group{padding:10px 20px 4px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sa-saffron-dark);border-top:1px solid var(--sa-hair)}
.group:first-of-type{border-top:none}
.rrow{display:flex;align-items:center;gap:16px;padding:11px 20px}
.rrow .grow{flex:1;min-width:0}
.rrow h4{margin:0 0 2px;font-size:14.5px;font-weight:700;color:var(--sa-ink);line-height:1.3}
.rrow small{display:block;font-size:13px;color:var(--sa-muted);line-height:1.4}
.rrow .via{font-size:12.5px;color:var(--sa-ink-muted);white-space:nowrap;max-width:260px;text-align:right}
.rrow a.go{color:var(--sa-primary-600);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.rfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--sa-surface);border-top:1px solid var(--sa-hair)}
.rfoot a{color:var(--sa-primary-600);font-weight:600;font-size:13.5px;text-decoration:none}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<main class="wrap sec">
  <div>
    <h1 class="sec-t">Find Schemes for You</h1>
    <p class="sec-lede">Choose who you are. The schemes that name that group are listed by what they provide, with the place to apply.</p>
  </div>
  <div class="strip" id="strip"></div>
  <div id="out"></div>
  <p class="note">A scheme naming a group is not a decision on any application — the sanctioning authority decides that.</p>
</main>
<script>
/* No masthead: this option is reviewed as the section alone.
   Persona first, one tap, no questions. Rows are grouped by offering so the
   same right-hand side the finder asks about is visible here without asking.
   The row's link goes to the scheme's own page, which carries the portal —
   the "common thing" agreed on 8 September; the portal is named beside it. */
const el = id => document.getElementById(id);
const PER_GROUP = 3;   // rows per offering, so the panel fits the fold
let sel = 'student';
function draw(){
  el('strip').innerHTML = PERSONAS.map(g =>
    `<button class="chip" data-g="${g.id}" aria-pressed="${g.id===sel}">${g.short}</button>`).join('');
  const g = PERSONAS.find(x=>x.id===sel);
  const groups = offersFor(sel).map(o => ({ o, rows: matchSchemes({ who:sel, offer:o.id }) })).filter(x=>x.rows.length);
  el('out').innerHTML = `
    <div class="result rise">
      <div class="rhead"><span class="m">${markHTML(g.id)}</span><div><b>${g.label}</b><p>${g.sub}</p></div></div>
      ${groups.map(({o,rows}) => `
        <div class="group">${o.label}</div>
        ${rows.slice(0,PER_GROUP).map(s => `
          <div class="rrow"><div class="grow"><h4>${s.name}</h4><small>${s.provides}</small></div>
            <span class="via">${applyLabel(s.apply[0])}</span>
            <a class="go" href="#">Scheme page →</a></div>`).join('')}
        ${rows.length>PER_GROUP ? `<div class="rrow" style="padding-top:0"><a class="go" href="scheme-b.html?g=${sel}&o=${o.id}">More ${o.short.toLowerCase()} for this group →</a></div>` : ''}`).join('')}
      <div class="rfoot"><a href="scheme-b.html?g=${sel}">All Schemes for ${g.short} →</a></div>
    </div>`;
}
el('strip').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  sel = b.dataset.g; draw();
});
draw();
</script></body></html>
