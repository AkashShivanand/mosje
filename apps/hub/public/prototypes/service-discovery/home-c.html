<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Find Schemes for You — Home page, Option C</title>
<link rel="stylesheet" href="core.css">
<style>
.strip{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 22px}
.result{border:1px solid var(--sa-hair);border-radius:var(--sa-radius-lg);overflow:hidden;background:#fff}
.rhead{padding:14px 20px;border-bottom:1px solid var(--sa-hair);display:flex;align-items:center;gap:14px}
.rhead img{width:52px;height:52px;object-fit:contain;border-radius:50%;background:var(--sa-primary-50);flex:none}
.rhead .mark-none{width:52px;height:52px;border-radius:50%;flex:none}
.rhead b{font-size:16px;color:var(--sa-primary-800)}
.rhead p{margin:4px 0 0;font-size:13px;color:var(--sa-ink-muted)}
.rrow{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--sa-hair)}
.rrow:last-child{border-bottom:none}
.rrow .grow{flex:1}
.rrow h4{margin:5px 0 3px;font-size:14.5px;font-weight:700;color:var(--sa-ink)}
.rrow small{font-size:12.5px;color:var(--sa-muted)}
.rfoot{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;background:var(--sa-surface)}
</style></head><body>
<script src="data.js"></script><script src="shell.js"></script>
<main class="wrap sec">
  <p class="eyebrow">Citizen Services</p>
  <div>
    <h1 class="sec-t">Find Schemes for You</h1>
    <p class="sec-lede">Choose who you are. You are shown the portal, the scheme and the complaint route for that group — no questions asked.</p>
  </div>
  <div class="strip" id="strip"></div>
  <div id="out"></div>
  <p class="note">One tap. Listing is not a decision on any application — the sanctioning authority decides that.</p>
</main>
<script>
mountShell('Home');
const el = id => document.getElementById(id);
const ROUTES = {
  sc:     { portal:['National Scholarship Portal','Apply for Post-Matric and Pre-Matric scholarships'], grievance:'Public Grievance Portal' },
  obc:    { portal:['National Scholarship Portal','Apply for PM-YASASVI and OBC hostels'], grievance:'Public Grievance Portal' },
  dnt:    { portal:['SEED Portal','Coaching, health insurance, housing and livelihood for DNT communities'], grievance:'Public Grievance Portal' },
  safai:  { portal:['NAMASTE Portal','Profiling, safety equipment and capital subsidy for sanitation workers'], grievance:'Public Grievance Portal' },
  senior: { portal:['Elderline 14567','Toll-free helpline for senior citizens, in your language'], grievance:'Public Grievance Portal' },
  tg:     { portal:['National Portal for Transgender Persons','Apply for the Identity Certificate and welfare support'], grievance:'Public Grievance Portal' },
  drug:   { portal:['NMBA — 14446','De-addiction centres and counselling, toll free'], grievance:'Public Grievance Portal' },
  ngo:    { portal:['e-Anudaan','Apply for grant-in-aid as a voluntary organisation'], grievance:'Public Grievance Portal' },
  pwd:    { portal:['depwd.gov.in','Handled by the Department of Empowerment of Persons with Disabilities'], grievance:'Public Grievance Portal' },
};
let sel = 'tg';
function draw(){
  el('strip').innerHTML = GROUPS.map(g =>
    `<button class="chip" data-g="${g.id}" aria-pressed="${g.id===sel}">${g.label}</button>`).join('');
  const g = GROUPS.find(x=>x.id===sel), r = ROUTES[sel];
  const scheme = SCHEMES.find(s=>s.g.includes(sel));
  el('out').innerHTML = `
    <div class="result rise">
      <div class="rhead">${markHTML(g.id)}<div><b>${g.label}</b><p>${g.sub}</p></div></div>
      <div class="rrow"><div class="grow"><span class="tag saff">Portal</span>
        <h4>${r.portal[0]}</h4><small>${r.portal[1]}</small></div>
        <button class="btn">Apply now →</button></div>
      ${scheme ? `<div class="rrow"><div class="grow"><span class="tag blue">Scheme</span>
        <h4>${scheme.t}</h4><small>${scheme.benefit} · run by ${scheme.runBy}</small></div>
        <button class="btn ghost">Apply now →</button></div>` : ''}
      <div class="rrow"><div class="grow"><span class="tag grey">Complaint</span>
        <h4>${r.grievance}</h4><small>Report denial of a right, discrimination, or a benefit not received</small></div>
        <button class="btn ghost">Visit →</button></div>
      <div class="rfoot"><a href="scheme-b.html?g=${sel}" style="color:var(--sa-primary-600);font-weight:600;font-size:13.5px;text-decoration:none">All ${g.label} schemes →</a></div>
    </div>`;
}
el('strip').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  sel = b.dataset.g; draw();
});
draw();
</script></body></html>
