name: UX4G widget pin

# UX4G deletes old accessibility-widget builds from its CDN without notice (v3.28 on
# 25 Sep 2026, v3.36 on 30 Sep 2026), and when the pinned build 404s the estate's
# accessibility panel silently stops loading on every page. This asks every morning.
on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:
  pull_request:
    paths:
      - packages/design-system/components/utilities/ux4g-accessibility-widget.tsx
      - tools/ux4g-pin/**

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The pinned UX4G widget build is live and carries the hooks we use
        run: node tools/ux4g-pin/check.mjs
