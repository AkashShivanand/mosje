name: Design System Quality

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/hub/src/app/design-system/**"
      - "apps/hub/src/components/design-system/**"
      - "scripts/check-changelog-freshness.mjs"
      - "apps/storybook/**"
      # Every script the job runs, so a change to a GATE re-runs the gate.
      - "scripts/check-storybook-coverage.mjs"
      - "scripts/check-storybook-parity.mjs"
      - "scripts/check-design-context.mjs"
      - "scripts/lib/ds-exports.mjs"
      - "scripts/smoke-storybook.mjs"
      - ".stylelintrc.tokens.json"
      - "tools/ds-linkage/**"
      - ".github/workflows/ds-quality.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/hub/src/app/design-system/**"
      - "apps/hub/src/components/design-system/**"
      - "scripts/check-changelog-freshness.mjs"
      - "apps/storybook/**"
      # Every script the job runs, so a change to a GATE re-runs the gate.
      - "scripts/check-storybook-coverage.mjs"
      - "scripts/check-storybook-parity.mjs"
      - "scripts/check-design-context.mjs"
      - "scripts/lib/ds-exports.mjs"
      - "scripts/smoke-storybook.mjs"
      - ".stylelintrc.tokens.json"
      - "tools/ds-linkage/**"
      - ".github/workflows/ds-quality.yml"

# A pull request that is pushed again supersedes its own in-flight run. Without this
# a hung run keeps reporting "pending" on the PR forever and cannot be displaced —
# on 2026-08-19 a stuck Chromium download ignored cancel AND force-cancel, and the
# only way to get a fresh runner was to push an empty commit. `main` is deliberately
# NOT cancelled: every commit on the trunk gets its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # A full green run takes ~5 minutes. Without this the default is SIX HOURS, which
    # is how one stuck download held two pull requests all morning.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog-freshness gate needs real history to ask
          # "what landed since the newest entry?" — depth 1 makes it skip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (workspace)
        run: npm install

      - name: Build tokens
        run: npm run build -w @mosje/tokens

      - name: Drift gate — committed token artifacts must match a fresh build
        run: |
          git diff --exit-code -- \
            packages/tokens/dist \
            packages/design-system/tokens.css \
            packages/config/tailwind-preset.cjs \
          || (echo "::error::Generated token artifacts are stale. Run 'npm run build -w @mosje/tokens' and commit the result." && exit 1)

      - name: Tokens contract test (legacy --ds-* + figma export)
        run: npm test -w @mosje/tokens

      - name: Design-system unit tests
        run: npm test -w @mosje/design-system

      - name: Changelog freshness — notable DS changes must be logged
        run: node scripts/check-changelog-freshness.mjs

      # The changelog gate above guards one half of the docs; this guards the
      # other. design.md is what agents read INSTEAD of the source, and it had
      # no gate at all — which is how the UX4G widget's entry was deleted by a
      # version-chain rewrite and nobody noticed for a day.
      - name: Design context — every exported component documented in design.md
        run: node scripts/check-design-context.mjs

      - name: Storybook coverage — every exported component needs a story
        run: node scripts/check-storybook-coverage.mjs

      # Coverage only asks whether a story EXISTS. These two ask whether it is
      # still true: parity catches a prop added with no story mentioning it and
      # a story left behind by a rename or deletion; the smoke test mounts every
      # story in Chromium and fails on a thrown error or an empty canvas.
      - name: Storybook parity — props exercised, no stale references
        run: node scripts/check-storybook-parity.mjs

      # Storybook builds with esbuild, which strips types without checking them,
      # so a story can ship a wrong prop value and still render. That is how a
      # Badge went out with status="error" — not a member of BadgeStatus, so it
      # emitted a class with no CSS rule and rendered untinted. Runs before the
      # smoke test because it is seconds, not minutes.
      - name: Typecheck Storybook stories
        run: npm run typecheck --prefix apps/storybook

      # NOT `--with-deps`. That flag shells out to `sudo apt-get install`, and on
      # 2026-08-19 it began hanging INDEFINITELY on the ubuntu-latest image — three
      # separate runs sat here for 40+ minutes and ignored both cancel and
      # force-cancel, blocking every PR in flight. The runner image already ships
      # every shared library Chromium needs, so the dependency half was always a
      # no-op here; only the browser download is real work.
      #
      # The step timeout is the backstop: if the download itself ever hangs, this
      # fails in 5 minutes instead of burning the job's full allowance.
      - name: Install Chromium for the Storybook smoke test
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Storybook smoke — every story must actually render
        run: node scripts/smoke-storybook.mjs

      - name: Typecheck design-system
        run: npm run typecheck -w @mosje/design-system

      - name: Token-lint — strict (no raw hex, no tier-1 use) across ALL component CSS
        run: npx stylelint --config .stylelintrc.tokens.json "packages/design-system/components/**/*.css"

      # The stylelint gate above covers the design-system PACKAGE's CSS. This one covers
      # the DOCUMENTATION — which had no gate at all, and drifted back to raw hexes twice
      # despite a written rule saying it must not. It reads the same rule
      # (.claude/rules/documentation-ds-linkage.md) and enforces the half of it that a
      # stylesheet linter cannot see: inline `style={{}}` objects, Tailwind arbitrary
      # values, and bare numerics like `fontSize: 13`, which React silently turns into px
      # and which no grep for "px" will ever find.
      #
      # It gates the properties the rule's own table names — fills, strokes, padding,
      # gaps, radii — and reports everything else (widths, grid tracks, breakpoints) as
      # advisory, so the gate stays honest rather than becoming a wall of exemptions.
      - name: DS linkage — documentation must be BUILT from the design system
        run: npm run check:ds-linkage

      # A RATCHET, not a sweep. 213 of 762 icon call sites sit off the seven-step size
      # scale, 126 of them at size={14} — chosen to sit against 14px body text, not by
      # accident. Raising those by 2px changes row heights in dense admin tables across
      # seven live portals, so the decision (2026-08-12) is to let them go as the pages
      # are redesigned one by one rather than spend a sweep on them now.
      #
      # This gate makes that safe: it costs nothing today, refuses to let the number
      # grow, and fails when a redesign takes some away without lowering the baseline —
      # so the backlog can only shrink and cannot quietly grow back. The baseline is PER
      # FILE, because a single global count would let one page add five off-scale icons
      # while another removed five and call it clean.
      - name: Icon scale — ratchet, no NEW off-scale icon sizing
        run: npm run check:icon-scale

      # `.figma.ts` templates are EXCLUDED from the design-system tsconfig, so nothing
      # type-checked them: a template could name a React prop that had been renamed, or a
      # Figma property that had been deleted, and every gate here stayed green while Dev
      # Mode served developers a snippet that does not compile. This is that gate.
      - name: Code Connect parity — templates match the props and the masters
        run: npm run check:code-connect

      # Publishing is the other half. A mapping that PARSES is not a mapping that
      # PUBLISHES, so PRs dry-run it: a template that would fail to publish fails the PR
      # instead of main.
      #
      # It is guarded on the secret, and that guard is load-bearing: `--dry-run` still
      # exits 1 without a token (verified 2026-08-18), so an unguarded step would fail
      # every fork PR and every run before the secret is set — a gate that fails for the
      # wrong reason is worse than no gate, because people learn to ignore it. The real
      # drift detector above needs no token and always runs.
      - name: Code Connect — publish dry run
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::warning::FIGMA_ACCESS_TOKEN unavailable (fork PR, or secret not set yet) — skipping the dry run. check:code-connect still ran."
            exit 0
          fi
          # From the REPO ROOT — the config's include glob is root-relative and a
          # workspace cwd silently matches zero templates.
          npm run figma:connect:check

  # Publishing runs ONLY on main, and only if the secret exists. Code Connect does not
  # detect drift by itself — it publishes a snapshot that goes stale silently — so this
  # job is what makes "kept in sync" true rather than ceremonial.
  #
  # FIGMA_ACCESS_TOKEN is a repository secret. It needs File content: Read and
  # Code Connect: Write. It is never committed, never printed, and no agent session
  # creates or reads it.
  publish-code-connect:
    needs: quality
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (workspace)
        run: npm install
      - name: Publish Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::warning::FIGMA_ACCESS_TOKEN is not set — skipping publish. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          npm run figma:connect
