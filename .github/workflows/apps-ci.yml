name: Apps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A pull request that is pushed again supersedes its own in-flight run. Without this
# a hung run keeps reporting "pending" on the PR forever and cannot be displaced —
# on 2026-08-19 a stuck Chromium download ignored cancel AND force-cancel, and the
# only way to get a fresh runner was to push an empty commit. `main` is deliberately
# NOT cancelled: every commit on the trunk gets its own complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The estate is single-origin: apps/hub is one npm workspace that serves the
# website (/website), the SAMAVESH docs (/design-system) and every portal
# (/portals/<slug>). There are no per-app lockfiles to `npm ci` against — the
# root lockfile covers every workspace — so this is one job, not one per app.
jobs:
  hub:
    name: hub lint + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      # `npm ci` at the root installs every workspace from the single lockfile.
      - name: Install (workspace)
        id: install
        run: npm ci

      # The design system ships TS/TSX source that the hub transpiles, and the
      # hub's Tailwind build reads the generated token CSS — so build tokens first.
      - run: npm run build -w @mosje/tokens

      - run: npm run lint

      # `lint:css` is the estate-wide token rule — no raw hex, no raw px where a
      # token exists. It lived only inside `npm run verify`, which CI never ran,
      # so `design-system-architecture.md` §2 was factually wrong when it said
      # "stylelint actively enforces this and will block commits". It blocked
      # nothing, because it never executed.
      - run: npm run lint:css

      - run: npm run check

      # The build is the gate that lint and typecheck cannot be: it is the only
      # step that proves every dependency actually resolves. The consolidation
      # moved the portals'/website's code into the hub while their package.json
      # manifests were deleted, and it kept passing locally purely on stale
      # hoisted node_modules — a state `npm ci` would never reproduce. A build
      # here fails loudly on that instead of shipping it.
      - run: npm --prefix apps/hub run build

      # ── Accessibility ────────────────────────────────────────────────────
      # Until 2026-09-02 the estate had ELEVEN Playwright specs and no workflow
      # that ran any of them, and a repository-wide grep for axe-core, pa11y,
      # jest-axe and lighthouse returned nothing — while radius tokens carried
      # six contract tests and a per-page ratchet. `CLAUDE.md` calls
      # accessibility non-negotiable; this is the first thing that enforces it.
      #
      # Serious and critical fail. Moderate and minor are reported. Deviations
      # that are recorded decisions are declared by selector in the spec, with
      # the evidence, so an allowance is readable rather than a silent exclusion.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe)
        run: npx playwright test e2e/a11y --reporter=line

      # ── Supply chain ─────────────────────────────────────────────────────
      # Twenty-two gates enforce radius tokens and icon pixel sizes; until this
      # step none enforced that the software is not exploitable. Eight runtime
      # advisories accumulated silently, one of them critical. High and above
      # fails; moderate is reported and does not block.
      #
      # IT RUNS LAST, AND THAT ORDERING IS THE POINT. Until 2026-09-04 it sat
      # above the build. A job stops at its first failing step, so when npm's
      # audit endpoint returned 503 on PR #281 the build and the accessibility
      # suite were both SKIPPED, and the PR reported a red
      # "hub lint + typecheck + build" whose build had never run — on an
      # accessibility change. The step that proves the least about this commit
      # must not decide whether the steps that prove the most get to speak.
      #
      # `!cancelled()` closes the mirror image of that bug: a failing build must
      # not hide a supply-chain advisory either. It is `!cancelled()` rather than
      # `always()` because the concurrency block above cancels a superseded PR
      # run, and `always()` would spend two more minutes auditing a run whose
      # answer nobody is waiting for. It is gated on the install, because
      # auditing a tree with no node_modules reports nothing useful.
      #
      # THE DECISION LIVES IN A SCRIPT, NOT IN THIS FILE. `npm audit` exits 1
      # both for "an advisory at or above --audit-level" and for "I could not
      # reach the registry", and those deserve opposite responses. Telling them
      # apart needs retries, JSON parsing and three distinct outcomes — more than
      # belongs in a workflow, where the only way to exercise a branch is to push
      # a commit and wait for a runner. `scripts/audit-production.mjs` holds it,
      # and its paths are driven against a stubbed npm so the ones the live
      # registry cannot produce — a critical advisory, an unrecognised failure —
      # are actually tested rather than reasoned about.
      - name: Audit production dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:audit
