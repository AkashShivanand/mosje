          cache-dependency-path: "apps/portals/pm-ajay/package-lock.json"
      - run: npm --prefix apps/portals/pm-ajay ci
      - run: npm --prefix apps/portals/pm-ajay run lint
        continue-on-error: true
      - run: npm --prefix apps/portals/pm-ajay run typecheck
