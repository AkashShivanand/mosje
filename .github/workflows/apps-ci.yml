name: Apps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hub:
    name: hub lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "apps/hub/package-lock.json"
      - run: npm --prefix apps/hub ci
      - run: npm --prefix apps/hub run lint
        continue-on-error: true
      - run: npm --prefix apps/hub run typecheck

  dosje:
    name: dosje lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
