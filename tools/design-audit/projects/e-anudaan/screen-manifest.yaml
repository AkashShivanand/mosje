# e-Anudaan (UAT) capture manifest.
# environment: uat — this, plus each flow's allowSubmit, is what permits the driver to
# press 'Submit Application' on a live UAT record.
#
# 2026-09-07: THREE submissions are authorised on UAT, one per scheme — asked for and
# granted in this session, not inherited from the previous run's note. They are on the
# flows that carry allowSubmit: true below:
#
#   napddr-new · avyay-new · shreshta-m2-application
#
# The NEW branch is chosen for the two branching schemes because it is the path that has
# never been captured and the one carrying build defects D1 and D2. The RENEWAL branches
# stay allowSubmit: false: the walker still reaches Review & Submit and captures it
# (-ARRIVED and -FILLED are taken before the submit gate is consulted), so their screens
# are obtained without filing a fourth and fifth record for schemes already submitted.
#
# Every officer-decision flow at the foot of this file stays FALSE and must stay FALSE.
# A submission is additive — it creates a new record. An officer decision is not: it
# mutates a case the other 23 demonstration accounts are staged against.
version: 1
environment: uat
stalenessCeiling: 14d
volatile:
- pattern: \b\d{2}[/-]\d{2}[/-]\d{4}\b
- pattern: \b\d{1,2}\s+\w+\s+\d{4}\b
- pattern: \b\d{1,2}:\d{2}\s*(AM|PM|am|pm)?\b
- pattern: ^\s*\d+\s*$
- pattern: \b(just now|minutes? ago|hours? ago|days? ago)\b
- pattern: \bGIA[/-][A-Z0-9/-]+\b
- pattern: \bSHRESHTA[_/-]M2[/-][A-Z0-9/-]+\b
fixtures:
  ngo:
    text: Example Welfare Society
    email: contact@example-welfare.org
    tel: '9800000000'
screens: []
flows:
# TWO branches per scheme wherever a Case Type controls the form. The previous manifest walked
# whichever branch the saved draft happened to be on — which was renewal — so the new-project path
# was never captured, and the defects that live on it (see docs/audit/e-anudaan-build-defects.md)
# were invisible. `set` flips the controller explicitly; `fill_all` never would, because it does
# not overwrite an answer that is already there.
- id: napddr-new
  role: ngo-user
  entry: /apply-grant/scheme/NAPDDR/step-1
  allowSubmit: true
  alwaysReplay: true
  reuseRecord: null
  steps:
  - set: {field: Case Type, value: New project}
  - walk: {prefix: NGO-NAPDDR-NEW, upload: fixtures/sample-document.pdf, maxSteps: 24}
- id: napddr-renewal
  role: ngo-user
  entry: /apply-grant/scheme/NAPDDR/step-1
  allowSubmit: false
  alwaysReplay: true
  reuseRecord: null
  steps:
  - set: {field: Case Type, value: Ongoing / Renewal}
  - walk: {prefix: NGO-NAPDDR-RENEWAL, upload: fixtures/sample-document.pdf, maxSteps: 24}
- id: avyay-new
  role: ngo-user
  entry: /apply-grant/scheme/AVYAY/step-1
  allowSubmit: true
  alwaysReplay: true
  reuseRecord: null
  steps:
  - set: {field: Case Type, value: New project}
  - walk: {prefix: NGO-AVYAY-NEW, upload: fixtures/sample-document.pdf, maxSteps: 24}
- id: avyay-renewal
  role: ngo-user
  entry: /apply-grant/scheme/AVYAY/step-1
  allowSubmit: false
  alwaysReplay: true
  reuseRecord: null
  steps:
  - set: {field: Case Type, value: Ongoing / Renewal}
  - walk: {prefix: NGO-AVYAY-RENEWAL, upload: fixtures/sample-document.pdf, maxSteps: 24}
- id: shreshta-m2-application
  role: ngo-user
  entry: /apply-grant/scheme/SHRESHTA_M2/step-1
  allowSubmit: true
  alwaysReplay: true
  reuseRecord: null
  steps:
  - walk: {prefix: NGO-SHRESHTA-M2, upload: fixtures/sample-document.pdf, maxSteps: 24}

# ---------------------------------------------------------------------------
# Officer DECISION screens — tracker outstanding #3, added 2026-09-07.
#
# Where a grant is forwarded, returned, queried, sanctioned or rejected. Every one of
# these screens sits ONE click behind a worklist we have been capturing since August, and
# that click was never made — so the corpus held 24 worklists and not one decision screen.
#
# allowSubmit is FALSE on every flow here and must stay false. The engine's DESTRUCTIVE
# regex (forward|approve|reject|sanction|concur|submit|deficien|quer|return|save|confirm|
# delete|send) refuses each of those labels while the gate is shut, and 'Review' matches
# none of them — so the screen is photographed and no decision is ever fired. A UAT
# environment staged for stakeholder demonstrations is not somewhere to spend workflow
# state, and unlike the applicant wizard these actions are NOT additive: they mutate cases
# the other demonstration accounts are staged against.
# ---------------------------------------------------------------------------
- id: sm2-pd-aso-decision
  role: sm2-pd-aso
  entry: /dashboard/pd/aso
  allowSubmit: false
  alwaysReplay: true
  steps:
  - capture: SM2-PD-ASO-WORKLIST
  - click: Review
    waitMs: 4000
  - capture: SM2-PD-ASO-DECISION
